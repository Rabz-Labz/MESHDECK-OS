; MESHDECK 2 firmware for the M5Stack Tab5 (ESP32-P4).
;
; Build:   pio run -d platform/tab5
; Flash:   pio run -d platform/tab5 -t upload
;
; Everything is pinned (platform release and library commits) so a build today and a build in a
; year produce the same firmware. No paths outside the repository.
;
; V0 note: built on Arduino-ESP32 (as MESHDECK 1.x) while the power baseline is measured. Whether
; v2 moves to plain ESP-IDF for full power management is decision D3 in PLAN-V2.md.

[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32-p4-evboard
framework = arduino
board_build.mcu = esp32p4
board_build.flash_mode = qio
board_upload.flash_size = 16MB
; The same A/B partition table as MESHDECK 1.x, so v2 installs into the MESHDECK slot and the
; spare slot, Myne saves and FIELD//OS notes stay where they are.
board_build.partitions = partitions.csv
monitor_speed = 115200
; The default 1,500,000 baud can hang esptool over the Tab5's USB-Serial/JTAG port.
upload_speed = 460800
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; LVGL reads config/lv_conf.h, shared with the simulator and the tests
    -DLV_CONF_INCLUDE_SIMPLE
    -I../../config
lib_deps =
    ; the portable core (core/library.json) and LVGL, used in place rather than copied
    meshdeck_core=symlink://../../core
    lvgl=symlink://../../third_party/lvgl
    https://github.com/m5stack/M5Unified.git#44952cb8e4ac88bf04ad23b9dfd6f4b05c788348
    https://github.com/m5stack/M5GFX.git#7cb26b44ab31bb41a0a597196dd2c6d868869a21
